<!doctype html>
<html lang="en" data-palette="violet" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>if(matchMedia('(max-width:700px)').matches&&!/[?&]desk=1/.test(location.search))location.replace('quick.html'+location.hash)</script>
<title>Shipra Porwal</title>
<meta name="description" content="Shipra Porwal: execute.experience.express. Builder, editor and storyteller.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="gate">
  <h1>Shipra Porwal</h1>
  <p>execute.experience.express</p>
  <div class="row">
    <button class="btn" data-sound="1">Enter with sound</button>
    <button class="btn alt" data-sound="0">Enter without sound</button>
  </div>
</div>

<!-- Top-right controls: Theme, Sound, Profile (Quick view) -->
<nav id="ctl" aria-label="Controls">
  <button id="theme" aria-label="Toggle dark and light mode" title="Toggle theme">🌙</button>
  <button id="snd" aria-label="Toggle sound" title="Toggle sound">🔊</button>
  <a href="quick.html" id="qview" aria-label="Profile quick view" title="Profile quick view">
    <svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
    </svg>
  </a>
</nav>

<!-- Bottom-right: Color palette switcher -->
<div id="pal-ctl" aria-label="Palette switcher">
  <button id="pal" aria-label="Switch color palette" title="Change palette">
    <svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
      <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
      <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
      <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.68 1.5-1.5 0-.38-.15-.74-.42-1-.27-.27-.43-.64-.43-1.02 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.5-4.5-10-10-10z"/>
    </svg>
  </button>
</div>

<svg width="0" height="0" aria-hidden="true" style="position:absolute"><filter id="liquid" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="4" result="n"><animate attributeName="baseFrequency" dur="7s" values="0.012 0.02;0.022 0.034;0.012 0.02" repeatCount="indefinite"/></feTurbulence><feDisplacementMap id="dm" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="water" aria-hidden="true"></div>
<main id="scene"></main>
<aside id="panel" aria-live="polite"></aside>

<script src="js/config.js"></script>
<script src="js/shared.js"></script>
<script src="js/fx.js"></script>
<script src="js/main.js"></script>
</body>
</html>
